name: RouteCalib CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy matplotlib
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible offline benchmark and plot check
        run: python -m routecalib.cli benchmark --out /tmp/routecalib-ci-results --n-total 600 --seed 42
