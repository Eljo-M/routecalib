[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routecalib"
version = "0.1.0"
description = "Conformal-calibrated multi-model LLM router with SLA enforcement, semantic caching, and shadow drift detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
routecalib = "routecalib.cli:main"

[tool.setuptools.packages.find]
include = ["routecalib*"]
